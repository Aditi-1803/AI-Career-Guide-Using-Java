
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAREERIQ - Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #312e81, #581c87);
            color: white;
        }

        .login-card {
            width: 90%;
            max-width: 400px;
            padding: 35px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: #c4b5fd;
            margin-bottom: 8px;
        }

        h2 {
            text-align: center;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #c4b5fd;
            margin-bottom: 18px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #8b5cf6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #7c3aed;
        }

        .error {
            color: #fecaca;
            margin-bottom: 15px;
        }

        .register {
            text-align: center;
            margin-top: 22px;
        }

        a {
            color: #c4b5fd;
        }
    </style>
</head>

<body>

<div class="login-card">

    <h1>CAREERIQ</h1>
    <h2>Welcome Back</h2>

    <form action="/login" method="post">

        <label for="email">Email Address</label>
        <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required>

        <label for="password">Password</label>
        <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required>

        <p class="error"
           th:if="${errorMessage}"
           th:text="${errorMessage}">
        </p>

        <button type="submit">Login</button>

    </form>

    <p class="register">
        Don't have an account?
        <a href="/register">Create Account</a>
    </p>

</div>

</body>
</html>
